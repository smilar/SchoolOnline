name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: online-school-frontend/package-lock.json
    
    - name: Run backend tests
      run: mvn clean test
    
    - name: Build backend
      run: mvn clean package -DskipTests
    
    - name: Install frontend dependencies
      working-directory: online-school-frontend
      run: npm ci
    
    - name: Run frontend tests
      working-directory: online-school-frontend
      run: npm test -- --run
    
    - name: Build frontend
      working-directory: online-school-frontend
      run: npm run build
    
    - name: Build Docker images
      run: |
        docker build -t online-school-backend:latest .
        docker build -t online-school-frontend:latest ./online-school-frontend
    
    - name: Push to Docker Hub
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
        docker tag online-school-backend:latest $DOCKER_USERNAME/online-school-backend:latest
        docker tag online-school-frontend:latest $DOCKER_USERNAME/online-school-frontend:latest
        docker push $DOCKER_USERNAME/online-school-backend:latest
        docker push $DOCKER_USERNAME/online-school-frontend:latest
    
    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST 'cd /app && docker-compose pull && docker-compose up -d'
    
    - name: Notify deployment
      if: success()
      run: echo "Deployment successful!"
    
    - name: Notify failure
      if: failure()
      run: echo "Deployment failed!"
